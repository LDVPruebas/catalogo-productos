backend:
  name: git-gateway
  branch: main # O master, dependiendo de tu repositorio

media_folder: "images/uploads" # Dónde se guardarán las imágenes que subas
public_folder: "/images/uploads"

collections:
  - name: "catalogo"
    label: "Catálogo de Productos"
    files:
      - name: "productos"
        label: "Lista de Productos"
        file: "productos.json"
        fields:
          - label: "Productos"
            name: "productos"
            widget: "list"
            fields:
              - {label: "ID", name: "id", widget: "string"}
              - {label: "Título", name: "titulo", widget: "string"}
              - {label: "Descripción", name: "descripcion", widget: "text"}
              - {label: "Precio", name: "precio", widget: "string"}
              - {label: "Imagen", name: "imagen", widget: "image"}
