<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="[https://identity.netlify.com/v1/netlify-identity-widget.js](https://identity.netlify.com/v1/netlify-identity-widget.js)"></script>
  <title>Catálogo de Productos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="header">
    <h1>Catálogo de Productos</h1>
    <p>Encuentra los mejores productos al mejor precio</p>
  </header>

  <main class="container">
    <section class="grid-productos" id="catalogo">
      <!-- Los productos se cargarán aquí automáticamente desde JavaScript -->
    </section>
  </main>

  <script>
    // Cargar productos desde el archivo JSON
    fetch('productos.json')
      .then(response => response.json())
      .then(productos => {
        const contenedor = document.getElementById('catalogo');
        contenedor.innerHTML = ''; // Limpiar por si acaso

        productos.forEach(prod => {
          const article = document.createElement('article');
          article.className = 'card';
          article.innerHTML = `
            <img src="${prod.imagen}" alt="${prod.titulo}" class="card-img">
            <div class="card-body">
              <h2 class="card-title">${prod.titulo}</h2>
              <p class="card-desc">${prod.descripcion}</p>
              <div class="card-footer">
                <span class="price">${prod.precio}</span>
              </div>
            </div>
          `;
          contenedor.appendChild(article);
        });
      })
      .catch(error => console.error('Error cargando los productos:', error));
  </script>

</body>
</html>
